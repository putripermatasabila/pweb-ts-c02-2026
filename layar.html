<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layar Antrian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="layar.css" />
  </head>
  <body>
    <div class="shell">
      <nav class="navbar" aria-label="Navigasi utama">
        <a class="brand" href="layar.html">
          <img
            src="1600w-iYOMf9zQ8c0.webp"
            alt="Logo Rumah Sakit"
            class="brand-logo"
            width="34"
            height="34"
          />
          Antrian RS
        </a>
        <ul class="nav-links">
          <li><a href="layar.html" aria-current="page">Layar Antrian</a></li>
          <li id="nav-take-ticket"><a href="ambil-antrian.html">Ambil Nomor</a></li>
        </ul>
        <div class="nav-actions">
          <a class="btn btn-sm btn-ghost" href="login.html" id="btn-login-layar">Masuk</a>
          <button
            type="button"
            id="btn-fullscreen"
            class="btn btn-icon btn-ghost"
            title="Layar Penuh"
            aria-label="Layar Penuh"
          >
            <svg
              id="icon-fullscreen"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
            </svg>
          </button>
        </div>
      </nav>

      <header class="page-title">
        <span class="screen-label">INFORMASI PASIEN</span>
        <h1>Nomor Sedang Dipanggil</h1>
        <p>Diperbarui <span id="last-updated">-</span></p>
      </header>

      <main>
        <!-- Kartu per jenis antrian diisi oleh dist/layar.js (polling 2 sampai 3 detik) -->
        <section
          id="display-grid"
          class="card-grid"
          aria-live="polite"
        ></section>
        <p id="empty-state" class="empty-state" hidden>
          Belum ada jenis antrian yang aktif.
        </p>
      </main>
    </div>

    <template id="display-card-template">
      <article class="card display-card">
        <header class="card-head">
          <h2 class="service-name"></h2>
          <span class="code-badge"></span>
        </header>
        <div class="display-body">
          <span class="status-dot">Dipanggil</span>
          <p class="called-number"></p>
          <p class="empty-note">Belum ada nomor dipanggil</p>
        </div>
        <footer class="card-foot">
          <span class="waiting-count">0</span> tiket menunggu
        </footer>
      </article>
    </template>

    <!-- Jika tim memakai import antar file, ganti menjadi: <script type="module" src="dist/layar.js"></script> -->
    <script src="dist/layar.js" defer></script>
  </body>
</html>
